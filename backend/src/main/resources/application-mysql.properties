spring.datasource.url=${LIBTECA_DB_URL:${libteca.mysql.url:jdbc:mysql://localhost:3306/libteca}}
spring.datasource.username=${LIBTECA_DB_USERNAME:${libteca.mysql.username:root}}
spring.datasource.password=${LIBTECA_DB_PASSWORD:${libteca.mysql.password:}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
