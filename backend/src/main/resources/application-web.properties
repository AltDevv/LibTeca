spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# Reconhece HTTPS e o host público encaminhados pelo ngrok/proxy local.
# O Tomcat só aceita esses cabeçalhos dos proxies confiáveis, incluindo loopback.
server.forward-headers-strategy=native
server.tomcat.remoteip.host-header=X-Forwarded-Host
springdoc.swagger-ui.csrf.enabled=true
libteca.arquivos.diretorio=${LIBTECA_ARQUIVOS:./data/arquivos}
libteca.cors.origens=${LIBTECA_CORS_ORIGENS:}
libteca.instalacao.diretorio=${LIBTECA_CONFIG_DIR:./data}
# Caminho relativo ao diretório de execução; iniciando em backend, grava em backend/logs.
logging.file.name=${LIBTECA_LOG_DIR:./logs}/libteca.log
# O JAR usa os recursos empacotados. Na execução direta pela IDE, aceita a pasta de desenvolvimento.
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:../frontEnd/,file:./frontEnd/
