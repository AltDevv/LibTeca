spring.datasource.url=jdbc:sqlite:./data/libteca.db
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.data-source-properties.date_class=TEXT
spring.datasource.hikari.data-source-properties.date_string_format=yyyy-MM-dd
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-sqlite.sql
# O esquema é criado pelo SQL acima: SQLite usa INTEGER PRIMARY KEY para IDs Long.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
