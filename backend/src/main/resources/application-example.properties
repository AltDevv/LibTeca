# Copie este arquivo para application.properties ao configurar um novo ambiente.
spring.application.name=libteca-backend
server.port=8080
spring.profiles.active=${DB_PROFILE:instalacao-banco}
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
# URL e credenciais são configuradas em application-mysql.properties
# ou pelas variáveis SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
# Na primeira execução, escolha o banco pela tela de instalação.
# SQLite cria automaticamente a pasta e o arquivo do banco.

spring.profiles.include=web

spring.config.import=optional:file:${LIBTECA_CONFIG_DIR:./data}/banco.properties
