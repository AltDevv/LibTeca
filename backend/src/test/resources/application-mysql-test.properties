spring.datasource.url=${LIBTECA_MYSQL_TEST_URL}
spring.datasource.username=${LIBTECA_MYSQL_TEST_USER:root}
spring.datasource.password=${LIBTECA_MYSQL_TEST_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modelo.sql
logging.level.org.springframework.security=ERROR
libteca.agendamentos=false

libteca.instalacao.gerar-codigo=false
